<!-- public/custom_404.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kotra Hub - Page Not Found</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            background: #0a0f1e;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            cursor: default;
        }

        .block404 {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #0a0f1e 0%, #111936 30%, #0f172a 60%, #0a0f1e 100%);
            overflow: hidden;
            cursor: default;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Glitch Background Animation */
        .glitch-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(ellipse at 20% 50%, rgba(15, 157, 154, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(15, 157, 154, 0.06) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 100%, rgba(15, 157, 154, 0.04) 0%, transparent 40%);
            z-index: 0;
            animation: bgPulse 8s ease-in-out infinite;
        }

        @keyframes bgPulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* Grid overlay */
        .grid-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(15, 157, 154, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(15, 157, 154, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 0;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(40px, 40px); }
        }

        /* Glitch Lines */
        .glitch-line {
            position: absolute;
            left: 0;
            width: 100%;
            height: 2px;
            background: rgba(15, 157, 154, 0.1);
            z-index: 1;
            animation: glitchLine 4s ease-in-out infinite;
        }

        .glitch-line:nth-child(1) {
            top: 15%;
            animation-delay: 0s;
            height: 1px;
        }

        .glitch-line:nth-child(2) {
            top: 30%;
            animation-delay: 1.2s;
            height: 1.5px;
            width: 70%;
            left: 15%;
        }

        .glitch-line:nth-child(3) {
            top: 55%;
            animation-delay: 2.5s;
            height: 1px;
            width: 80%;
            left: 10%;
        }

        .glitch-line:nth-child(4) {
            top: 75%;
            animation-delay: 0.8s;
            height: 2px;
            width: 60%;
            left: 20%;
        }

        .glitch-line:nth-child(5) {
            top: 90%;
            animation-delay: 1.8s;
            height: 1px;
            width: 90%;
            left: 5%;
        }

        @keyframes glitchLine {
            0%, 100% { opacity: 0.1; transform: translateX(-20px); }
            50% { opacity: 0.4; transform: translateX(20px); }
        }

        /* Floating particles */
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: rgba(15, 157, 154, 0.3);
            border-radius: 50%;
            animation: floatParticle 15s infinite linear;
        }

        .particle:nth-child(1) { top: 10%; left: 20%; animation-delay: 0s; }
        .particle:nth-child(2) { top: 30%; left: 80%; animation-delay: 2s; width: 4px; height: 4px; }
        .particle:nth-child(3) { top: 60%; left: 10%; animation-delay: 4s; }
        .particle:nth-child(4) { top: 80%; left: 70%; animation-delay: 6s; width: 5px; height: 5px; }
        .particle:nth-child(5) { top: 45%; left: 90%; animation-delay: 8s; }
        .particle:nth-child(6) { top: 20%; left: 50%; animation-delay: 3s; width: 2px; height: 2px; }
        .particle:nth-child(7) { top: 70%; left: 40%; animation-delay: 7s; }
        .particle:nth-child(8) { top: 90%; left: 25%; animation-delay: 5s; width: 4px; height: 4px; }

        @keyframes floatParticle {
            0% { transform: translateY(0) translateX(0); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(-100vh) translateX(50px); opacity: 0; }
        }

        /* Main Content Container */
        .content {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 2rem;
        }

        /* Kotra Hub Logo - Glitch Style */
        .kotra-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-bottom: 1.5rem;
            position: relative;
        }

        .kotra-logo span {
            font-size: 2rem;
            font-weight: 900;
            letter-spacing: -0.5px;
            position: relative;
        }

        .kotra-logo .kotra {
            color: #f1f5f9;
        }

        .kotra-logo .hub {
            color: #0f9d9a;
        }

        .kotra-logo .dot {
            color: #0f9d9a;
            font-size: 2.2rem;
            font-weight: 900;
            margin: 0 2px;
            animation: dotPulse 2s ease-in-out infinite;
        }

        @keyframes dotPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }

        /* 3D 404 Number - Large */
        .number-3d-wrapper {
            position: relative;
            display: inline-block;
            margin: 0.5rem 0 1rem;
            perspective: 800px;
        }

        .number-3d {
            font-size: 12rem;
            font-weight: 900;
            line-height: 1;
            color: #0f9d9a;
            display: inline-block;
            transform-style: preserve-3d;
            transform: rotateX(8deg) rotateY(-5deg) translateZ(30px);
            text-shadow: 
                0 2px 0 #0e8d8a,
                0 4px 0 #0c7d7a,
                0 6px 0 #0a6d6a,
                0 8px 0 #085d5a,
                0 10px 0 #064d4a,
                0 12px 0 #043d3a,
                0 15px 30px rgba(15, 157, 154, 0.4),
                0 20px 60px rgba(15, 157, 154, 0.2);
            letter-spacing: -12px;
            position: relative;
            animation: float3D 4s ease-in-out infinite;
            font-family: 'Inter', sans-serif;
        }

        /* Glitch effect on 404 */
        .number-3d::before,
        .number-3d::after {
            content: '404';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
        }

        .number-3d::before {
            color: #ff6b6b;
            transform: translate(-4px, 0);
            animation: glitchText1 3s infinite;
            text-shadow: none;
        }

        .number-3d::after {
            color: #4ecdc4;
            transform: translate(4px, 0);
            animation: glitchText2 3s infinite;
            text-shadow: none;
        }

        @keyframes glitchText1 {
            0%, 90%, 100% { opacity: 0; transform: translate(-4px, 0); }
            92% { opacity: 0.8; transform: translate(-6px, 2px); }
            94% { opacity: 0; transform: translate(-2px, -2px); }
            96% { opacity: 0.6; transform: translate(-8px, 0); }
            98% { opacity: 0; transform: translate(-3px, 1px); }
        }

        @keyframes glitchText2 {
            0%, 90%, 100% { opacity: 0; transform: translate(4px, 0); }
            93% { opacity: 0.8; transform: translate(6px, -2px); }
            95% { opacity: 0; transform: translate(2px, 2px); }
            97% { opacity: 0.6; transform: translate(8px, 0); }
            99% { opacity: 0; transform: translate(3px, -1px); }
        }

        @keyframes float3D {
            0%, 100% {
                transform: rotateX(8deg) rotateY(-5deg) translateZ(30px) translateY(0);
            }
            50% {
                transform: rotateX(10deg) rotateY(-8deg) translateZ(40px) translateY(-12px);
            }
        }

        /* Glow ring behind number */
        .glow-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(15, 157, 154, 0.15) 0%, transparent 70%);
            animation: pulseGlow 3s ease-in-out infinite;
            pointer-events: none;
            z-index: -1;
        }

        @keyframes pulseGlow {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            50% { transform: translate(-50%, -50%) scale(1.3); opacity: 1; }
        }

        /* Subtitle */
        .subtitle {
            font-size: 2rem;
            font-weight: 800;
            color: #f1f5f9;
            margin: 0.5rem 0 0.75rem;
            letter-spacing: -0.5px;
            position: relative;
        }

        .subtitle::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, transparent, #0f9d9a, transparent);
            border-radius: 2px;
        }

        /* Message */
        .message {
            font-size: 1.1rem;
            color: #94a3b8;
            line-height: 1.6;
            margin: 1.5rem 0 2rem;
            font-weight: 400;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        .message strong {
            color: #0f9d9a;
            font-weight: 600;
        }

        /* Buttons */
        .button-group {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            text-decoration: none;
            background: linear-gradient(135deg, #0f9d9a 0%, #0e8d8a 100%);
            color: white;
            padding: 0.9rem 2.2rem;
            border-radius: 1rem;
            font-weight: 700;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            box-shadow: 0 8px 24px rgba(15, 157, 154, 0.3);
            border: none;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .btn-primary::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: left 0.5s ease;
        }

        .btn-primary:hover::before {
            left: 100%;
        }

        .btn-primary:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 12px 32px rgba(15, 157, 154, 0.4);
            background: linear-gradient(135deg, #10adab 0%, #0f9d9a 100%);
        }

        .btn-primary:active {
            transform: translateY(0) scale(0.98);
        }

        .btn-primary svg {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }

        .btn-secondary {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            text-decoration: none;
            color: #94a3b8;
            padding: 0.85rem 2rem;
            border-radius: 1rem;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            border: 1.5px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.03);
            cursor: pointer;
        }

        .btn-secondary:hover {
            background: rgba(15, 157, 154, 0.08);
            border-color: #0f9d9a;
            color: #f1f5f9;
            transform: translateY(-3px);
        }

        /* Footer */
        .footer-text {
            margin-top: 2.5rem;
            font-size: 0.8rem;
            color: #475569;
            letter-spacing: 0.3px;
        }

        .footer-text a {
            color: #0f9d9a;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .footer-text a:hover {
            color: #50b3ac;
            text-decoration: underline;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .number-3d {
                font-size: 8rem;
                letter-spacing: -8px;
            }

            .number-3d::before,
            .number-3d::after {
                font-size: 8rem;
            }

            .glow-ring {
                width: 280px;
                height: 280px;
            }

            .kotra-logo span {
                font-size: 1.5rem;
            }

            .subtitle {
                font-size: 1.5rem;
            }

            .message {
                font-size: 1rem;
                padding: 0 1rem;
            }

            .button-group {
                flex-direction: column;
                align-items: center;
                width: 100%;
                max-width: 320px;
                margin: 0 auto;
            }

            .btn-primary,
            .btn-secondary {
                width: 100%;
                justify-content: center;
                padding: 0.8rem 1.5rem;
            }
        }

        @media (max-width: 480px) {
            .number-3d {
                font-size: 5.5rem;
                letter-spacing: -4px;
            }

            .number-3d::before,
            .number-3d::after {
                font-size: 5.5rem;
            }

            .glow-ring {
                width: 200px;
                height: 200px;
            }

            .kotra-logo span {
                font-size: 1.2rem;
            }

            .kotra-logo .dot {
                font-size: 1.5rem;
            }

            .subtitle {
                font-size: 1.2rem;
            }

            .message {
                font-size: 0.9rem;
            }

            .grid-overlay {
                background-size: 20px 20px;
            }
        }

        /* Glitch flash effect */
        .glitch-flash {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 157, 154, 0.02);
            z-index: 0;
            pointer-events: none;
            animation: flashGlitch 8s infinite;
        }

        @keyframes flashGlitch {
            0%, 95%, 100% { opacity: 0; }
            96% { opacity: 0.3; }
            97% { opacity: 0; }
            98% { opacity: 0.2; }
            99% { opacity: 0; }
        }

        /* Scanline effect */
        .scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 0, 0, 0.03) 2px,
                rgba(0, 0, 0, 0.03) 4px
            );
            z-index: 0;
            pointer-events: none;
        }

        /* Vignette */
        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.4) 100%);
            z-index: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="block404">
        <!-- Background Effects -->
        <div class="glitch-bg"></div>
        <div class="grid-overlay"></div>
        <div class="glitch-flash"></div>
        <div class="scanlines"></div>
        <div class="vignette"></div>

        <!-- Glitch Lines -->
        <div class="glitch-line"></div>
        <div class="glitch-line"></div>
        <div class="glitch-line"></div>
        <div class="glitch-line"></div>
        <div class="glitch-line"></div>

        <!-- Floating Particles -->
        <div class="particles">
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
        </div>

        <!-- Main Content -->
        <div class="content">
            <!-- Logo -->
            <div class="kotra-logo">
                <span class="kotra">KOTRA</span>
                <span class="hub">HUB</span>
            </div>

            <!-- 3D Number with Glitch -->
            <div class="number-3d-wrapper">
                <div class="glow-ring"></div>
                <div class="number-3d">404</div>
            </div>

            <!-- Subtitle -->
            <h2 class="subtitle">Page Not Found</h2>

            <!-- Message -->
            <p class="message">
                The page or resource you're looking for<br>
                was not found on the <strong>Kotra Hub</strong>.
            </p>

            <!-- Buttons -->
            <div class="button-group">
                <a href="/" class="btn-primary">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
                    </svg>
                    Back to Dashboard
                </a>
                <a href="mailto:it.support@kotrapharma.com" class="btn-secondary">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="18" height="18">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                    </svg>
                    Contact Support
                </a>
            </div>

            <div class="footer-text">
                If you believe this is an error, please contact <a href="mailto:it.support@kotrapharma.com">IT Support</a>
            </div>
        </div>
    </div>
</body>
</html>
